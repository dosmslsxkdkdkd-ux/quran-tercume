<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quran — Rahat oxu</title>
<style>
body{margin:0;background:#f5f1e7;color:#202a25;font-family:Georgia,serif}
header{background:#173c32;color:white;padding:15px;position:sticky;top:0}
button,input{padding:10px;border-radius:8px;border:1px solid #ccc}
main{max-width:850px;margin:auto;padding:15px}
#text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:23px;line-height:2;background:#fffdf7;padding:24px;border-radius:12px}
.dark{background:#101815;color:#eee}
.dark #text{background:#19231f;color:#eee}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
</style>
</head>
<body>
<header>
<h2>📖 Quran — Rahat oxu</h2>
<input id="file" type="file" accept="application/pdf">
<button onclick="document.body.classList.toggle('dark')">🌙 Gecə rejimi</button>
</header>
<main>
<div class="controls">
<button onclick="changeSize(-2)">A−</button>
<button onclick="changeSize(2)">A+</button>
<button onclick="prev()">← Əvvəlki</button>
<span id="page">PDF seçilməyib</span>
<button onclick="next()">Növbəti →</button>
</div>
<input id="search" placeholder="Mətndə axtar..." oninput="findText()">
<div id="text">Öz Quran PDF faylını seç və rahat oxumağa başla.</div>
<div id="results"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc=
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdf,p=1,size=23,all=[];
const el=id=>document.getElementById(id);
el('file').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 el('text').textContent='PDF açılır...';
 try{
  pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
  all=[];
  for(let i=1;i<=pdf.numPages;i++){
   const pg=await pdf.getPage(i),c=await pg.getTextContent();
   all.push(c.items.map(x=>x.str).join(' '));
  }
  p=1;show();
 }catch(e){el('text').textContent='PDF açıla bilmədi. Yenidən yoxla.';}
};
function show(){
 if(!pdf)return;
 el('text').textContent=all[p-1]||'Bu səhifədən mətn çıxarmaq mümkün olmadı.';
 el('text').style.fontSize=size+'px';
 el('page').textContent=p+' / '+pdf.numPages;
}
function next(){if(pdf&&p<pdf.numPages){p++;show()}}
function prev(){if(pdf&&p>1){p--;show()}}
function changeSize(n){size=Math.max(14,Math.min(42,size+n));show()}
function findText(){
 const q=el('search').value.toLocaleLowerCase();
 if(!q||!pdf){el('results').textContent='';return}
 const hits=[];
 all.forEach((t,i)=>{if(t.toLocaleLowerCase().includes(q))hits.push(i+1)});
 el('results').textContent=hits.length?'Tapıldığı PDF səhifələri: '+hits.join(', '):'Tapılmadı';
}
</script>
</body>
</html>
