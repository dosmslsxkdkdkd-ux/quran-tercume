        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
        h1 { color: #38bdf8; text-align: center; }
        .container { max-width: 800px; margin: auto; }
        .search { width: 100%; padding: 12px; margin-bottom: 20px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .surah { background: #1e293b; border: 1px solid #334155; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; }
        .surah-title { font-weight: bold; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 12px; background: #334155; padding: 3px 8px; border-radius: 4px; color: #38bdf8; }
        .details { display: none; margin-top: 15px; border-top: 1px solid #334155; padding-top: 15px; cursor: default; }
        .surah.active .details { display: block; }
        textarea { width: 100%; height: 120px; background: #0f172a; color: #fff; border: 1px solid #334155; margin-top: 5px; border-radius: 6px; padding: 10px; box-sizing: border-box; font-family: inherit; resize: vertical; }
        .parsed-output { margin-top: 15px; background: #090d16; padding: 10px; border-radius: 6px; border: 1px dashed #334155; font-size: 14px; white-space: pre-wrap; max-height: 200px; overflow-y: auto; color: #cbd5e1; }
        .btns { text-align: center; margin-bottom: 20px; display: flex; justify-content: center; gap: 10px; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        button:hover { background: #0284c7; color: #fff; }
    </style>
</head>

        { name: "Hucurat Suresi", type: "Göç Sonrası" },
        { name: "Tevbe Suresi", type: "Göç Sonrası" },
        { name: "Nasr Suresi", type: "Göç Sonrası" }
    ];
    
    let data = JSON.parse(localStorage.getItem('quran_custom_data') || '{}');

    function render(filter = "") {
        const list = document.getElementById('list');
        list.innerHTML = '';
        surahs.forEach((surah, i) => {
            let num = i + 1;
            if(filter && !surah.name.toLowerCase().includes(filter.toLowerCase()) && !num.toString().includes(filter)) return;
            
            let savedText = data[num] || "";
            let div = document.createElement('div');
            div.className = 'surah';
            div.id = `s-${num}`;
            div.innerHTML = `
                <div class="surah-title" onclick="toggle(${num})">
                    <span>${num}. ${surah.name}</span>
                    <span class="badge">${surah.type}</span>
                </div>
                <div class="details" id="d-${num}" onclick="event.stopPropagation()">
                    <p style="margin:0 0 5px 0; font-size:13px; color:#94a3b8;">Ayələri bütöv şəkildə bura yapışdırın (məs: 1. Ayət... 2. Ayət...):</p>
                    <textarea id="text-${num}" placeholder="Ayətləri bura yapışdırın..." oninput="processText(${num})">${savedText}</textarea>
                    <div class="parsed-output" id="out-${num}">${savedText ? "✓ Yadda saxlanıldı və bölüşdürüldü" : "Hələ mətn əlavə edilməyib."}</div>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function toggle(num) {
        document.getElementById(`s-${num}`).classList.toggle('active');
    }

    function processText(num) {
        let val = document.getElementById(`text-${num}`).value;
        data[num] = val;
        localStorage.setItem('quran_custom_data', JSON.stringify(data));
        document.getElementById(`out-${num}`).innerText = val ? "✓ Mətn uğurla qeydə alındı." : "Hələ mətn əlavə edilməyib.";
    }

    function filterSurahs() {
        render(document.getElementById('search').value);
    }

    function exportJSON() {
        let blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "quran_sira_arxiv.json";
        a.click();
    }

    function copyAll() {
        let text = "";
        surahs.forEach((s, i) => {
            let num = i + 1;
            if(data[num]) {
                text += `=== ${num}. ${s.name} ===\n${data[num]}\n\n`;
            }
        });
        navigator.clipboard.writeText(text);
        alert("Bütün tərcümələr kopyalandı!");
    }

    render();
