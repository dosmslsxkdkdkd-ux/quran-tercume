<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Tərcümə Paneli</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --border: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        header {
            background-color: var(--card-bg);
            padding: 16px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 18px; color: var(--accent); font-weight: 700; }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        
        .search-box {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 16px;
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
        }
        .search-box:focus { border-color: var(--accent); }

        .surah-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.15s ease;
        }
        .surah-item:active { transform: scale(0.98); background-color: #1a253f; }
        .surah-name { font-size: 16px; font-weight: 600; }
        .status-badge {
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        .status-empty { background-color: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .status-full { background-color: rgba(34, 197, 94, 0.15); color: var(--success); }

        #surahView { display: none; }
        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 0 0 15px 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        /* Yapışdırma Paneli (Açılıb-bağlanan) */
        .paste-toggle-btn {
            background-color: var(--card-bg);
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }
        .paste-box-container {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            box-sizing: border-box;
            font-family: inherit;
            resize: vertical;
            font-size: 15px;
            outline: none;
        }
        textarea:focus { border-color: var(--accent); }

        .action-btn {
            background-color: var(--accent);
            color: #0b0f19;
            border: none;
            padding: 12px 15px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            font-size: 15px;
        }

        /* Oxuma Görünüşü (Şəkildəki kimi təmiz kitab tərzi) */
        .ayahs-container { display: flex; flex-direction: column; gap: 24px; padding-bottom: 30px; }
        .ayah-block {
            border-bottom: 1px solid rgba(30, 41, 59, 0.5);
            padding-bottom: 18px;
        }
        .ayah-num-tag {
            font-size: 12px;
            color: var(--accent);
            background-color: rgba(56, 189, 248, 0.1);
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 8px;
        }
        .ayah-text-view {
            font-size: 17px;
            line-height: 1.6;
            color: var(--text-main);
            word-break: break-word;
        }
        
        .global-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .global-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-weight: 600;
            cursor: pointer;
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 14px;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="headerTitle">Quran Tərcümə Paneli</h1>
    </header>

    <div class="container">
        <!-- Əsas Siyahı Səhifəsi -->
        <div id="listView">
            <div class="global-actions">
                <button onclick="exportJSON()">Arxivi Yüklə (JSON)</button>
                <button onclick="copyAll()">Hamısını Kopyala</button>
            </div>
            <input type="text" class="search-box" id="searchInput" placeholder="Surə axtar..." oninput="renderList()">
            <div id="surahList"></div>
        </div>

        <!-- Surə İçi Səhifəsi -->
        <div id="surahView">
            <button class="back-btn" onclick="goBack()">← Geri qayıt</button>
            
            <button class="paste-toggle-btn" onclick="togglePasteBox()">+ Yeni Mətn Yapışdır / Yenilə</button>
            
            <div class="paste-box-container" id="pasteBox">
                <textarea id="bulkInput" placeholder="Məsələn: 1. Ayət... 6,7,8. Ayətlər birlikdə..."></textarea>
                <button class="action-btn" onclick="parseAndFill()">Mətni Avtomatik Yerləşdir</button>
            </div>

            <div class="ayahs-container" id="ayahsListContainer"></div>
        </div>
    </div>

<script>
    const surahs = [
        "Fatiha Suresi", "İhlas Suresi", "Zilzal Suresi", "Alak Suresi", "Tekvir Suresi", "Karia Suresi", "Kıyamet Suresi", "Yakia Suresi", "Necm Suresi", "Müddessir Suresi",
        "Müzzemmil Suresi", "Kureyş Suresi", "Fil Suresi", "Nebe Suresi", "Kadir Suresi", "Kafirun Suresi", "Maun Suresi", "Hümeze Suresi", "Tebbet Suresi", "Tekasur Suresi",
        "Tarık Suresi", "Duha Suresi", "İnşirah Suresi", "Kevser Suresi", "Kalem Suresi", "Felak Suresi", "Nas Suresi", "Asır Suresi", "Tin Suresi", "İnsan Suresi",
        "Şems Suresi", "Ala Suresi", "Leyl Suresi", "Fecir Suresi", "Beled Suresi", "İnfitar Suresi", "İnşikak Suresi", "Murselat Suresi", "Adiyat Suresi", "Gaşiye Suresi",
        "Tur Suresi", "Hakka Suresi", "Mearic Suresi", "Saffat Suresi", "Şuara Suresi", "Lokman Suresi", "Fatır Suresi", "Furkan Suresi", "Rahman Suresi", "Secde Suresi",
        "Meryem Suresi", "Naziat Suresi", "Fussilet Suresi", "Casiye Suresi", "Rad Suresi", "Kamer Suresi", "Sad Suresi", "Taha Suresi", "Kaf Suresi", "İsra Suresi",
        "Buruc Suresi", "Mutaffifin Suresi", "Kehf Suresi", "Hud Suresi", "Enam Suresi", "Zariyat Suresi", "Zuhruf Suresi", "Zümer Suresi", "Şura Suresi", "Hicir Suresi",
        "Araf Suresi", "Yasin Suresi", "Mülk Suresi", "Yunus Suresi", "Kasas Suresi", "Yusuf Suresi", "Mümin Suresi", "Enbiya Suresi", "İbrahim Suresi", "Müminun Suresi",
        "Cin Suresi", "Ahkaf Suresi", "Abese Suresi", "Nemil Suresi", "Sebe Suresi", "Ankebut Suresi", "Nahil Suresi", "Duhan Suresi", "Nuh Suresi", "Rum Suresi",
        "Cuma Suresi", "Tegabun Suresi", "Beyyine Suresi", "Bakara Suresi", "Hac Suresi", "Ali Imran Suresi", "Münafikun Suresi", "Enfal Suresi", "Muhammed Suresi", "Saf Suresi",
        "Nisa Suresi", "Maide Suresi", "Nur Suresi", "Mücadele Suresi", "Ahzab Suresi", "Haşr Suresi", "Tahrim Suresi", "Talak Suresi", "Hadid Suresi", "Fetih Suresi",
        "Mümtehine Suresi", "Hucurat Suresi", "Tevbe Suresi", "Nasr Suresi"
    ];

    let db = {};
    try {
        let savedData = localStorage.getItem('quran_app_clean_db');
        if (savedData) db = JSON.parse(savedData);
    } catch(e) { db = {}; }

    function saveData() {
        try {
            localStorage.setItem('quran_app_clean_db', JSON.stringify(db));
        } catch(e) {}
    }

    let currentSurahIndex = null;

    function renderList() {
        const filter = document.getElementById('searchInput').value.toLowerCase();
        const listEl = document.getElementById('surahList');
        listEl.innerHTML = '';

        surahs.forEach((name, index) => {
            let num = index + 1;
            if (filter && !name.toLowerCase().includes(filter) && !num.toString().includes(filter)) return;

            let surahData = db[num] || {};
            let ayahsObj = surahData.ayahs || {};
            let hasContent = Object.keys(ayahsObj).length > 0 && Object.values(ayahsObj).some(val => val && val.trim() !== "");
            
            let statusClass = hasContent ? "status-full" : "status-empty";
            let statusText = hasContent ? "Doludur" : "Boşdur";

            let item = document.createElement('div');
            item.className = 'surah-item';
            item.onclick = () => openSurah(index);
            item.innerHTML = `
                <span class="surah-name">${num}. ${name}</span>
                <span class="status-badge ${statusClass}">${statusText}</span>
            `;
            listEl.appendChild(item);
        });
    }

    function openSurah(index) {
        currentSurahIndex = index;
        let num = index + 1;
        document.getElementById('listView').style.display = 'none';
        document.getElementById('surahView').style.display = 'block';
        document.getElementById('headerTitle').innerText = surahs[index];
        document.getElementById('pasteBox').style.display = 'none';
        document.getElementById('bulkInput').value = '';

        renderAyahBlocks();
    }

    function goBack() {
        document.getElementById('surahView').style.display = 'none';
        document.getElementById('listView').style.display = 'block';
        document.getElementById('headerTitle').innerText = "Quran Tərcümə Paneli";
        renderList();
    }

    function togglePasteBox() {
        let box = document.getElementById('pasteBox');
        box.style.display = box.style.display === 'block' ? 'none' : 'block';
    }

    function renderAyahBlocks() {
        let num = currentSurahIndex + 1;
        if (!db[num]) db[num] = { ayahs: {} };
        
        let container = document.getElementById('ayahsListContainer');
        container.innerHTML = '';

        let ayahs = db[num].ayahs || {};
        let keys = Object.keys(ayahs);

        if (keys.length === 0) {
            container.innerHTML = `<div class="empty-state">Hələ bu surəyə mətn əlavə edilməyib.<br>Yuxarıdakı düyməyə basaraq mətn yapışdıra bilərsiniz.</div>`;
            return;
        }

        keys.sort((a, b) => {
            return a.localeCompare(b, undefined, {numeric: true});
        });

        keys.forEach(key => {
            let text = ayahs[key] || "";
            let block = document.createElement('div');
            block.className = 'ayah-block';
            block.innerHTML = `
                <div><span class="ayah-num-tag">${key}</span></div>
                <div class="ayah-text-view">${text}</div>
            `;
            container.appendChild(block);
        });
    }

    function parseAndFill() {
        let rawText = document.getElementById('bulkInput').value;
        if (!rawText.trim()) return;

        let num = currentSurahIndex + 1;
        if (!db[num]) db[num] = { ayahs: {} };

        let parts = rawText.split(/(?=\b\d+[\s\.\-\)]+)/);
        
        parts.forEach(part => {
            let match = part.match(/^\s*([\d\-\,\s]+)\s*[\.\-\)]\s*([\s\S]*)$/);
            if (match) {
                let ayahKey = match[1].trim().replace(/\s+/g, '');
                let ayahText = match[2].trim();
                if(ayahKey && ayahText) {
                    db[num].ayahs[ayahKey] = ayahText;
                }
            }
        });

        saveData();
        document.getElementById('bulkInput').value = '';
        document.getElementById('pasteBox').style.display = 'none';
        renderAyahBlocks();
    }

    function exportJSON() {
        let blob = new Blob([JSON.stringify(db, null, 2)], {type: "application/json"});
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "quran_temiz_arxiv.json";
        a.click();
    }

    function copyAll() {
        let text = "";
        surahs.forEach((name, idx) => {
            let num = idx + 1;
            if (db[num] && db[num].ayahs) {
                let ayahs = db[num].ayahs;
                let keys = Object.keys(ayahs);
                if(keys.length > 0) {
                    text += `=== ${num}. ${name} ===\n`;
                    keys.forEach(k => {
                        if(ayahs[k]) text += `${k}. ${ayahs[k]}\n`;
                    });
                    text += "\n";
                }
            }
        });
        navigator.clipboard.writeText(text);
        alert("Bütün tərcümələr kopyalandı!");
    }

    renderList();
</script>
</body>
</html>
