<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Tərcüməsi - Güncəlləmə Paneli</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #f39c12;
            text-align: center;
        }
        .box {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        textarea {
            width: 100%;
            height: 120px;
            background: #2b2b2b;
            color: #fff;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 10px;
            font-size: 14px;
            box-sizing: border-box;
            resize: vertical;
        }
        .btn-group {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-save {
            background-color: #27ae60;
            color: white;
        }
        .btn-clear {
            background-color: #c0392b;
            color: white;
        }
        .output-area {
            margin-top: 20px;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <h1>Quran Tərcümə Paneli</h1>

    <div class="box">
        <h3>Yeni Ayət / Tərcümə Əlavə Et</h3>
        <p style="font-size: 13px; color: #aaa;">İstədiyin fərqli tərcüməni bura yapışdır, surə və ayət nömrəsini qeyd et.</p>
        
        <label for="sureSelect">Surəni Seç:</label>
        <select id="sureSelect" style="width: 100%; padding: 8px; margin-bottom: 10px; background: #2b2b2b; color: #fff; border: 1px solid #444; border-radius: 5px;">
            <option value="Fatihə">1. Fatihə Surəsi</option>
            <option value="Bəqərə">2. Bəqərə Surəsi</option>
            <!-- Ehtiyaca görə digərlərini də artırarsan -->
        </select>

        <textarea id="translationInput" placeholder="Tərcüməni və ya ayəti bura yapışdır..."></textarea>
        
        <div class="btn-group">
            <button class="btn-save" onclick="saveTranslation()">Əlavə Et / Yadda Saxla</button>
            <button class="btn-clear" onclick="clearAll()">Hamısını Sil</button>
        </div>
    </div>

    <div class="output-area">
        <h3>Nəticə (Surə Üzrə Görünüş):</h3>
        <div id="resultDisplay" style="color: #f1c40f; line-height: 1.6;">
            Hələ heç nə əlavə olunmayıb. Yuxarıdan mətn daxil edib yadda saxlayın.
        </div>
    </div>

    <script>
        function saveTranslation() {
            const text = document.getElementById('translationInput').value;
            const sure = document.getElementById('sureSelect').value;
            const display = document.getElementById('resultDisplay');
            
            if(text.trim() === "") {
                alert("Zəhmət olmasa mətn daxil edin!");
                return;
            }

            display.innerHTML = `<strong>[${sure}]</strong><br>` + text.replace(/\n/g, '<br>');
        }

        function clearAll() {
            document.getElementById('translationInput').value = '';
            document.getElementById('resultDisplay').innerHTML = 'Hələ heç nə əlavə olunmayıb. Yuxarıdan mətn daxil edib yadda saxlayın.';
        }
    </script>

</body>
</html>
