<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quran — Kitab kimi oxu</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eee9dc;color:#25382f;font-family:Arial,sans-serif}
header{background:#194638;color:white;padding:18px;text-align:center;font-size:23px;font-weight:bold}
main{max-width:850px;margin:auto;padding:12px}
input,button{font-size:16px;border-radius:9px;padding:11px}
input[type=file]{width:100%;background:white;margin:10px 0}
button{border:0;background:#d6e5d8;color:#193d30;cursor:pointer}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
#pageNum{width:90px;text-align:center}
#reader{background:#d8d3c8;border-radius:10px;padding:8px;min-height:180px;text-align:center;overflow:auto}
canvas{max-width:100%;height:auto;background:white;box-shadow:0 2px 9px #777}
#status{text-align:center;padding:10px;font-size:14px}
body.dark{background:#101713;color:#eee}
body.dark #reader{background:#080b09}
body.dark input{background:#222;color:white}
body.dark button{background:#30483a;color:white}
</style>
</head>
<body>
<header>📖 Quran — Rahat oxu</header>
<main>
  <p><b>Quran PDF faylını seç:</b></p>
  <input id="file" type="file" accept=".pdf,application/pdf">
  <div class="toolbar">
    <button id="night">🌙 Gecə rejimi</button>
    <button id="minus">A− Kiçilt</button>
    <button id="plus">A+ Böyüt</button>
  </div>
  <div class="toolbar">
    <button id="prev">❮ Əvvəlki</button>
    <input id="pageNum" type="number" min="1" value="1" aria-label="Səhifə nömrəsi">
    <button id="go">Get</button>
    <button id="next">Növbəti ❯</button>
  </div>
  <div id="status">Başlamaq üçün PDF faylını seç.</div>
  <div id="reader">Kitab səhifəsi burada görünəcək.</div>
</main>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdf=null;
let page=1;
let zoom=1;
let renderTask=null;
const reader=document.getElementById('reader');
const status=document.getElementById('status');
const pageNum=document.getElementById('pageNum');
document.getElementById('file').addEventListener('change',async function(e){
  const file=e.target.files[0];
  if(!file)return;
  status.textContent='PDF açılır...';
  try{
    const data=await file.arrayBuffer();
    pdf=await pdfjsLib.getDocument({data}).promise;
    pageNum.max=pdf.numPages;
    page=Number(localStorage.getItem('quranReaderPage'))||1;
    if(page>pdf.numPages)page=1;
    await showPage(page);
  }catch(err){
    status.textContent='PDF açıla bilmədi. İnternet bağlantısını yoxla.';
  }
});
async function showPage(n){
  if(!pdf){
    status.textContent='Əvvəlcə PDF faylını seç.';
    return;
  }
  page=Math.max(1,Math.min(pdf.numPages,Number(n)||1));
  pageNum.value=page;
  status.textContent='Səhifə '+page+' / '+pdf.numPages;
  try{
    if(renderTask){
      try{renderTask.cancel()}catch(e){}
    }
    const pdfPage=await pdf.getPage(page);
    const original=pdfPage.getViewport({scale:1});
    const available=Math.max(250,reader.clientWidth-20);
    const scale=Math.min(available/original.width,1.5)*zoom;
    const viewport=pdfPage.getViewport({scale});
    const ratio=window.devicePixelRatio||1;
    const canvas=document.createElement('canvas');
    const ctx=canvas.getContext('2d');
    canvas.width=Math.floor(viewport.width*ratio);
    canvas.height=Math.floor(viewport.height*ratio);
    canvas.style.width=viewport.width+'px';
    canvas.style.height=viewport.height+'px';
    reader.replaceChildren(canvas);
    const sharpViewport=pdfPage.getViewport({scale:scale*ratio});
    renderTask=pdfPage.render({
      canvasContext:ctx,
      viewport:sharpViewport
    });
    await renderTask.promise;
    localStorage.setItem('quranReaderPage',page);
    status.textContent='Səhifə '+page+' / '+pdf.numPages;
  }catch(err){
    if(err.name!=='RenderingCancelledException'){
      status.textContent='Səhifə göstərilmədi. Yenidən yoxla.';
    }
  }
}
document.getElementById('prev').onclick=()=>showPage(page-1);
document.getElementById('next').onclick=()=>showPage(page+1);
document.getElementById('go').onclick=()=>showPage(pageNum.value);
pageNum.addEventListener('keydown',e=>{
  if(e.key==='Enter')showPage(pageNum.value);
});
document.getElementById('plus').onclick=()=>{
  zoom=Math.min(2,zoom+0.15);
  showPage(page);
};
document.getElementById('minus').onclick=()=>{
  zoom=Math.max(0.6,zoom-0.15);
  showPage(page);
};
document.getElementById('night').onclick=()=>{
  document.body.classList.toggle('dark');
};
let touchX=0;
reader.addEventListener('touchstart',e=>{
  touchX=e.changedTouches[0].screenX;
},{passive:true});
reader.addEventListener('touchend',e=>{
  const diff=e.changedTouches[0].screenX-touchX;
  if(Math.abs(diff)>70){
    if(diff<0)showPage(page+1);
    else showPage(page-1);
  }
},{passive:true});
</script>
</body>
</html>
