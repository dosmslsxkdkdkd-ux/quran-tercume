<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quran Tərcüməsi</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f5f7fb;
    color: #20242a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

button,
input,
textarea {
    font: inherit;
}

.hidden {
    display: none !important;
}

/* HEADER */

.header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #e5e8ee;
}

.header-inner {
    max-width: 1000px;
    margin: auto;
    padding: 18px;
}

.header-title {
    margin: 0;
    font-size: 25px;
    font-weight: 800;
}

.header-subtitle {
    margin-top: 5px;
    color: #737b87;
    font-size: 14px;
}

/* CONTAINER */

.container {
    max-width: 1000px;
    margin: auto;
    padding: 18px;
}

/* SEARCH */

.search-box {
    width: 100%;
    padding: 15px 16px;
    border: 1px solid #dfe4eb;
    border-radius: 14px;
    background: white;
    outline: none;
    font-size: 16px;
    margin-bottom: 16px;
}

.search-box:focus {
    border-color: #667eea;
}

/* HOME BUTTONS */

.archive-home {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
}

.archive-home button {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 14px 10px;
    font-weight: 750;
    cursor: pointer;
}

.export-button {
    background: #4d63d8;
    color: white;
}

.import-button {
    background: #e9edf5;
    color: #303743;
}

/* SURAH LIST */

.surah-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.surah-item {
    background: white;
    border: 1px solid #e5e8ee;
    border-radius: 16px;
    padding: 15px;
    cursor: pointer;
    min-height: 76px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.surah-item:active {
    transform: scale(0.98);
}

.surah-number {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #eef2ff;
    color: #4d63c9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    flex-shrink: 0;
}

.surah-info {
    min-width: 0;
}

.surah-name {
    font-size: 16px;
    font-weight: 750;
}

.surah-arabic {
    font-size: 13px;
    color: #8a929d;
    margin-top: 3px;
}

/* READER */

.reader-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
}

.back-button {
    border: none;
    background: #e9edf5;
    color: #303743;
    padding: 11px 15px;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
}

.reader-title {
    flex: 1;
}

.reader-title h2 {
    margin: 0;
    font-size: 24px;
}

.reader-title div {
    margin-top: 3px;
    color: #858d98;
    font-size: 13px;
}

.action-row {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
}

.action-button {
    border: none;
    border-radius: 12px;
    padding: 12px 15px;
    cursor: pointer;
    font-weight: 700;
}

.add-button {
    background: #4d63d8;
    color: white;
}

.delete-all-button {
    background: #ffe7e7;
    color: #c73535;
}

/* READER PAGE */

.reader-page {
    background: white;
    border: 1px solid #e3e6eb;
    border-radius: 18px;
    padding: 28px 23px;
    box-shadow: 0 5px 20px rgba(20,30,50,0.04);
}

.quran-text {
    white-space: pre-wrap;
    word-break: normal;
    overflow-wrap: break-word;
    font-size: 20px;
    line-height: 1.9;
    color: #24282f;
}

.empty-message {
    text-align: center;
    padding: 50px 20px;
    color: #89919c;
    line-height: 1.7;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0,0,0,0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
}

.modal-box {
    width: 100%;
    max-width: 700px;
    background: white;
    border-radius: 22px 22px 0 0;
    padding: 20px;
    max-height: 90vh;
    overflow-y: auto;
}

.modal-title {
    font-size: 21px;
    font-weight: 800;
    margin-bottom: 7px;
}

.modal-info {
    color: #747d88;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 14px;
}

.verse-input {
    width: 100%;
    min-height: 300px;
    resize: vertical;
    border: 1px solid #dce1e8;
    border-radius: 14px;
    padding: 15px;
    outline: none;
    font-size: 17px;
    line-height: 1.7;
    background: #fbfcfe;
}

.verse-input:focus {
    border-color: #667eea;
}

.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

.modal-actions button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 13px;
    font-weight: 800;
    cursor: pointer;
}

.cancel-button {
    background: #edf0f4;
    color: #303640;
}

.save-button {
    background: #4d63d8;
    color: white;
}

/* MOBILE */

@media (max-width: 600px) {

    .container {
        padding: 14px;
    }

    .header-inner {
        padding: 15px 14px 13px;
    }

    .header-title {
        font-size: 22px;
    }

    .surah-list {
        grid-template-columns: 1fr;
    }

    .reader-page {
        border-radius: 14px;
        padding: 23px 18px;
    }

    .quran-text {
        font-size: 19px;
        line-height: 1.95;
    }

    .reader-title h2 {
        font-size: 21px;
    }

    .archive-home {
        flex-direction: column;
    }

    .action-row {
        flex-wrap: wrap;
    }
}

/* LANDSCAPE */

@media (orientation: landscape) and (max-height: 600px) {

    .container {
        max-width: 1100px;
    }

    .reader-page {
        padding-left: 45px;
        padding-right: 45px;
    }

    .quran-text {
        font-size: 21px;
        line-height: 1.9;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <h1 class="header-title">Quran Tərcüməsi</h1>
        <div class="header-subtitle">
            Surəni seç və oxumağa başla
        </div>
    </div>
</header>


<!-- ANA SƏHİFƏ -->

<main id="homePage" class="container">

    <input
        id="searchInput"
        class="search-box"
        type="search"
        placeholder="Surə axtar..."
        autocomplete="off"
    >

    <!-- ARXİV YALNIZ BURADADIR -->

    <div class="archive-home">

        <button
            class="export-button"
            onclick="exportArchive()"
        >
            📦 Bütün məlumatları arxivlə
        </button>

        <button
            class="import-button"
            onclick="document.getElementById('importFile').click()"
        >
            📥 Arxivi yüklə
        </button>

    </div>

    <div id="surahList" class="surah-list"></div>

</main>


<!-- OXU SƏHİFƏSİ -->

<main id="readerPage" class="container hidden">

    <div class="reader-top">

        <button
            class="back-button"
            onclick="goHome()"
        >
            ← Geri
        </button>

        <div class="reader-title">

            <h2 id="readerSurahName"></h2>

            <div id="readerSurahNumber"></div>

        </div>

    </div>


    <div class="action-row">

        <button
            class="action-button add-button"
            onclick="openAddModal()"
        >
            + Ayə əlavə et
        </button>

        <button
            class="action-button delete-all-button"
            onclick="deleteAllVerses()"
        >
            Hamısını sil
        </button>

    </div>


    <div class="reader-page">

        <div
            id="quranText"
            class="quran-text"
        ></div>

    </div>

</main>


<!-- AYƏ ƏLAVƏ ET -->

<div
    id="addModal"
    class="modal hidden"
>

    <div class="modal-box">

        <div class="modal-title">
            Ayələri əlavə et
        </div>

        <div class="modal-info">

            Ayələri necə kopyalamısansa,
            elə də aşağıya yapışdır.

            <br><br>

            <b>
                Proqram heç bir nömrə əlavə etməyəcək.
            </b>

            <br>

            Ayələrin qabağında öz nömrələri varsa,
            olduğu kimi qalacaq.

        </div>


        <textarea
            id="verseInput"
            class="verse-input"
            placeholder="Hazır ayələri buraya yapışdır..."
        ></textarea>


        <div class="modal-actions">

            <button
                class="cancel-button"
                onclick="closeAddModal()"
            >
                Ləğv et
            </button>

            <button
                class="save-button"
                onclick="saveVerses()"
            >
                Yadda saxla
            </button>

        </div>

    </div>

</div>


<!-- ARXİV FAYLI -->

<input
    id="importFile"
    type="file"
    accept=".json,application/json"
    class="hidden"
    onchange="importArchive(event)"
>


<script>

/* =====================================================
   114 SURƏ
===================================================== */

const surahs = [

["Fatihə","الفاتحة"],
["Bəqərə","البقرة"],
["Ali-İmran","آل عمران"],
["Nisa","النساء"],
["Maidə","المائدة"],
["Ənam","الأنعام"],
["Əraf","الأعراف"],
["Ənfal","الأنفال"],
["Tövbə","التوبة"],
["Yunus","يونس"],
["Hud","هود"],
["Yusuf","يوسف"],
["Rəd","الرعد"],
["İbrahim","إبراهيم"],
["Hicr","الحجر"],
["Nəhl","النحل"],
["İsra","الإسراء"],
["Kəhf","الكهف"],
["Məryəm","مريم"],
["Taha","طه"],
["Ənbiya","الأنبياء"],
["Həcc","الحج"],
["Muminun","المؤمنون"],
["Nur","النور"],
["Furqan","الفرقان"],
["Şuəra","الشعراء"],
["Nəml","النمل"],
["Qəsəs","القصص"],
["Ənkəbut","العنكبوت"],
["Rum","الروم"],
["Loğman","لقمان"],
["Səcdə","السجدة"],
["Əhzab","الأحزاب"],
["Səba","سبأ"],
["Fatir","فاطر"],
["Yasin","يس"],
["Saffat","الصافات"],
["Sad","ص"],
["Zumər","الزمر"],
["Ğafir","غافر"],
["Fussilət","فصلت"],
["Şura","الشورى"],
["Zuxruf","الزخرف"],
["Duxan","الدخان"],
["Casiyə","الجاثية"],
["Əhqaf","الأحقاف"],
["Muhəmməd","محمد"],
["Fəth","الفتح"],
["Hucurat","الحجرات"],
["Qaf","ق"],
["Zariyat","الذاريات"],
["Tur","الطور"],
["Nəcm","النجم"],
["Qəmər","القمر"],
["Rəhman","الرحمن"],
["Vaqiə","الواقعة"],
["Hədid","الحديد"],
["Mücadilə","المجادلة"],
["Həşr","الحشر"],
["Mumtəhənə","الممتحنة"],
["Saff","الصف"],
["Cümə","الجمعة"],
["Münafiqun","المنافقون"],
["Təğabun","التغابن"],
["Talaq","الطلاق"],
["Təhrim","التحريم"],
["Mülk","الملك"],
["Qələm","القلم"],
["Haqqə","الحاقة"],
["Məaric","المعارج"],
["Nuh","نوح"],
["Cin","الجن"],
["Müzzəmmil","المزمل"],
["Müddəssir","المدثر"],
["Qiyamət","القيامة"],
["İnsan","الإنسان"],
["Mursəlat","المرسلات"],
["Nəbə","النبأ"],
["Naziat","النازعات"],
["Əbəsə","عبس"],
["Təkvir","التكوير"],
["İnfitar","الانفطار"],
["Mutəffifin","المطففين"],
["İnşiqaq","الانشقاق"],
["Büruc","البروج"],
["Tariq","الطارق"],
["Əla","الأعلى"],
["Ğaşiyə","الغاشية"],
["Fəcr","الفجر"],
["Bələd","البلد"],
["Şəms","الشمس"],
["Leyl","الليل"],
["Duha","الضحى"],
["İnşirah","الشرح"],
["Tin","التين"],
["Ələq","العلق"],
["Qədr","القدر"],
["Bəyyinə","البينة"],
["Zilzal","الزلزلة"],
["Adiyat","العاديات"],
["Qariə","القارعة"],
["Təkasur","التكاثر"],
["Əsr","العصر"],
["Huməzə","الهمزة"],
["Fil","الفيل"],
["Qureyş","قريش"],
["Maun","الماعون"],
["Kövsər","الكوثر"],
["Kafirun","الكافرون"],
["Nəsr","النصر"],
["Məsəd","المسد"],
["İxlas","الإخلاص"],
["Fələq","الفلق"],
["Nas","الناس"]

];


/* =====================================================
   YADDAŞ
===================================================== */

const STORAGE_KEY = "quranTranslations";

let data = loadData();

let currentSurah = null;


/* =====================================================
   MƏLUMATLARI YÜKLƏ
===================================================== */

function loadData() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (!saved) {
            return {};
        }

        return JSON.parse(saved);

    } catch (error) {

        console.error(error);

        return {};

    }

}


/* =====================================================
   MƏLUMATLARI YADDA SAXLA
===================================================== */

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


/* =====================================================
   SURƏLƏRİ GÖSTƏR
===================================================== */

function renderSurahs(filter = "") {

    const list =
        document.getElementById("surahList");

    list.innerHTML = "";

    const search =
        filter.trim().toLowerCase();

    surahs.forEach((surah, index) => {

        const number = index + 1;

        const name = surah[0];

        const arabic = surah[1];

        if (
            search &&
            !name.toLowerCase().includes(search) &&
            !String(number).includes(search)
        ) {
            return;
        }

        const item =
            document.createElement("div");

        item.className = "surah-item";

        item.onclick =
            () => openSurah(number);

        item.innerHTML = `

            <div class="surah-number">
                ${number}
            </div>

            <div class="surah-info">

                <div class="surah-name">
                    ${name}
                </div>

                <div class="surah-arabic">
                    ${arabic}
                </div>

            </div>
        `;

        list.appendChild(item);

    });

}


/* =====================================================
   SURƏNİ AÇ
===================================================== */

function openSurah(number) {

    currentSurah = number;

    document
        .getElementById("homePage")
        .classList.add("hidden");

    document
        .getElementById("readerPage")
        .classList.remove("hidden");

    document
        .getElementById("readerSurahName")
        .textContent =
        surahs[number - 1][0];

    document
        .getElementById("readerSurahNumber")
        .textContent =
        `${number}. surə`;

    renderReader();

    window.scrollTo(0, 0);

}


/* =====================================================
   OXU
===================================================== */

function renderReader() {

    const reader =
        document.getElementById("quranText");

    const text =
        data[currentSurah];

    if (!text || !text.trim()) {

        reader.innerHTML = `

            <div class="empty-message">

                Bu surədə hələ mətn əlavə edilməyib.

                <br><br>

                Yuxarıdakı
                <b>“+ Ayə əlavə et”</b>
                düyməsinə bas.

            </div>
        `;

        return;
    }

    /*
       BURADA HEÇ BİR AVTOMATİK
       NÖMRƏLƏMƏ YOXDUR.

       İstifadəçi nə yapışdırıbsa,
       eynilə göstərilir.
    */

    reader.textContent = text;

}


/* =====================================================
   GERİ
===================================================== */

function goHome() {

    document
        .getElementById("readerPage")
        .classList.add("hidden");

    document
        .getElementById("homePage")
        .classList.remove("hidden");

    currentSurah = null;

    window.scrollTo(0, 0);

}


/* =====================================================
   AYƏ ƏLAVƏ ET
===================================================== */

function openAddModal() {

    document
        .getElementById("verseInput")
        .value = "";

    document
        .getElementById("addModal")
        .classList.remove("hidden");

    setTimeout(() => {

        document
            .getElementById("verseInput")
            .focus();

    }, 100);

}


/* =====================================================
   MODALI BAĞLA
===================================================== */

function closeAddModal() {

    document
        .getElementById("addModal")
        .classList.add("hidden");

}


/* =====================================================
   MƏTNİ YADDA SAXLA
===================================================== */

function saveVerses() {

    const input =
        document.getElementById("verseInput").value;

    if (!input.trim()) {

        alert("Əvvəlcə mətni yapışdır.");

        return;
    }

    const oldText =
        data[currentSurah] || "";

    /*
       Yeni mətn köhnənin davamına əlavə olunur.
       Heç bir nömrə yaradılmır.
       Heç bir ayə bölünmür.
    */

    if (oldText.trim()) {

        data[currentSurah] =
            oldText.trimEnd() +
            "\n\n" +
            input;

    } else {

        data[currentSurah] = input;

    }

    saveData();

    closeAddModal();

    renderReader();

}


/* =====================================================
   BÜTÜN SURƏNİ SİL
===================================================== */

function deleteAllVerses() {

    const name =
        surahs[currentSurah - 1][0];

    const answer =
        confirm(
            `"${name}" surəsindəki bütün mətni silmək istəyirsən?`
        );

    if (!answer) {
        return;
    }

    delete data[currentSurah];

    saveData();

    renderReader();

}


/* =====================================================
   BÜTÜN QURAN MƏLUMATLARINI ARXİVLƏ
===================================================== */

function exportArchive() {

    /*
       BURADA BÜTÜN 114 SURƏ GEDİR.
       TƏKCƏ AÇIQ OLAN SURƏ YOX.
    */

    const archive = {

        app: "Quran Tərcüməsi",

        version: 2,

        createdAt:
            new Date().toISOString(),

        translations: data

    };

    const blob =
        new Blob(
            [
                JSON.stringify(
                    archive,
                    null,
                    2
                )
            ],
            {
                type: "application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "quran-tercumesi-butun-arxiv.json";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

}


/* =====================================================
   BÜTÜN ARXİVİ GERİ YÜKLƏ
===================================================== */

function importArchive(event) {

    const file =
        event.target.files[0];

    if (!file) {
        return;
    }

    const reader =
        new FileReader();

    reader.onload = function(e) {

        try {

            const imported =
                JSON.parse(e.target.result);

            const translations =
                imported.translations ||
                imported;

            if (
                !translations ||
                typeof translations !== "object"
            ) {

                throw new Error(
                    "Yanlış arxiv"
                );

            }

            const answer =
                confirm(
                    "Bu arxiv bütün surələrdəki mövcud məlumatların üstünə yazılacaq. Davam edilsin?"
                );

            if (!answer) {
                return;
            }

            /*
               BÜTÜN 114 SURƏNİN MƏLUMATI
               BİRDƏN GERİ QAYTARILIR.
            */

            data = translations;

            saveData();

            if (currentSurah) {
                renderReader();
            }

            alert(
                "Bütün Quran məlumatları uğurla yükləndi."
            );

        } catch (error) {

            console.error(error);

            alert(
                "Arxiv faylı oxunmadı."
            );

        }

    };

    reader.readAsText(file);

    event.target.value = "";

}


/* =====================================================
   AXTARIŞ
===================================================== */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        function() {

            renderSurahs(
                this.value
            );

        }
    );


/* =====================================================
   MODALIN ÇÖLÜNƏ BASANDA BAĞLANSIN
===================================================== */

document
    .getElementById("addModal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                closeAddModal();

            }

        }
    );


/* =====================================================
   BAŞLANĞIC
===================================================== */

renderSurahs();

</script>

</body>
</html>
