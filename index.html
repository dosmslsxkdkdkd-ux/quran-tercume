<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quran Tərcümə Paneli</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --border: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }
        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 20px; color: var(--accent); }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        
        /* Əsas Səhifə Siyahısı */
        .search-box {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 15px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .surah-item {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .surah-item:active { transform: scale(0.98); }
        .surah-name { font-size: 16px; font-weight: bold; }
        .status-badge {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
        }
        .status-empty { background-color: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .status-full { background-color: rgba(34, 197, 94, 0.15); color: var(--success); }

        /* Surə İçi Səhifəsi */
        #surahView { display: none; }
        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 0 0 15px 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .paste-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .paste-section h3 { margin-top: 0; font-size: 15px; color: var(--accent); }
        textarea {
            width: 100%;
            height: 100px;
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
            font-family: inherit;
            resize: vertical;
            font-size: 14px;
        }
        .action-btn {
            background-color: var(--accent);
            color: #0b0f19;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 14px;
        }
        
        /* Ayə Xanaları (Damalar) */
        .ayahs-container { display: flex; flex-direction: column; gap: 10px; }
        .ayah-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
        }
        .ayah-header-num { font-size: 13px; color: var(--text-muted); margin-bottom: 5px; font-weight: bold; }
        .ayah-input {
            width: 100%;
            height: 60px;
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
            line-height: 1.4;
        }
        .global-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .global-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <header>
        <h1 id="headerTitle">Quran Tərcümə Paneli</h1>
    </header>

    <div class="container">
        <!-- Əsas Siyahı Səhifəsi -->
        <div id="listView">
            <div class="global-actions">
                <button onclick="exportJSON()">Arxivi Yüklə (JSON)</button>
                <button onclick="copyAll()">Hamısını Kopyala</button>
            </div>
            <input type="text" class="search-box" id="searchInput" placeholder="Surə axtar..." oninput="renderList()">
            <div id="surahList"></div>
        </div>

        <!-- Surə İçi Səhifəsi -->
        <div id="surahView">
            <button class="back-btn" onclick="goBack()">← Geri qayıt</button>
            <h2 id="currentSurahTitle" style="margin-top:0; font-size:18px;"></h2>
            
            <!-- Demo Yapışdırma Bölməsi -->
            <div class="paste-section" id="demoPasteSection">
                <h3>Bütöv Yapışdır (Demo Rejimi)</h3>
                <textarea id="bulkInput" placeholder="Mətni bura yapışdırın..."></textarea>
                <button class="action-btn" onclick="parseAndFill()">Avtomatik Damalara Böl və Yığ</button>
            </div>

            <div class="ayahs-container" id="ayahsListContainer"></div>
        </div>
    </div>

<script>
    const surahs = [
        "Fatiha Suresi", "İhlas Suresi", "Zilzal Suresi", "Alak Suresi", "Tekvir Suresi", "Karia Suresi", "Kıyamet Suresi", "Yakia Suresi", "Necm Suresi", "Müddessir Suresi",
        "Müzzemmil Suresi", "Kureyş Suresi", "Fil Suresi", "Nebe Suresi", "Kadir Suresi", "Kafirun Suresi", "Maun Suresi", "Hümeze Suresi", "Tebbet Suresi", "Tekasur Suresi",
        "Tarık Suresi", "Duha Suresi", "İnşirah Suresi", "Kevser Suresi", "Kalem Suresi", "Felak Suresi", "Nas Suresi", "Asır Suresi", "Tin Suresi", "İnsan Suresi",
        "Şems Suresi", "Ala Suresi", "Leyl Suresi", "Fecir Suresi", "Beled Suresi", "İnfitar Suresi", "İnşikak Suresi", "Murselat Suresi", "Adiyat Suresi", "Gaşiye Suresi",
        "Tur Suresi", "Hakka Suresi", "Mearic Suresi", "Saffat Suresi", "Şuara Suresi", "Lokman Suresi", "Fatır Suresi", "Furkan Suresi", "Rahman Suresi", "Secde Suresi",
        "Meryem Suresi", "Naziat Suresi", "Fussilet Suresi", "Casiye Suresi", "Rad Suresi", "Kamer Suresi", "Sad Suresi", "Taha Suresi", "Kaf Suresi", "İsra Suresi",
        "Buruc Suresi", "Mutaffifin Suresi", "Kehf Suresi", "Hud Suresi", "Enam Suresi", "Zariyat Suresi", "Zuhruf Suresi", "Zümer Suresi", "Şura Suresi", "Hicir Suresi",
        "Araf Suresi", "Yasin Suresi", "Mülk Suresi", "Yunus Suresi", "Kasas Suresi", "Yusuf Suresi", "Mümin Suresi", "Enbiya Suresi", "İbrahim Suresi", "Müminun Suresi",
        "Cin Suresi", "Ahkaf Suresi", "Abese Suresi", "Nemil Suresi", "Sebe Suresi", "Ankebut Suresi", "Nahil Suresi", "Duhan Suresi", "Nuh Suresi", "Rum Suresi",
        "Cuma Suresi", "Tegabun Suresi", "Beyyine Suresi", "Bakara Suresi", "Hac Suresi", "Ali Imran Suresi", "Münafikun Suresi", "Enfal Suresi", "Muhammed Suresi", "Saf Suresi",
        "Nisa Suresi", "Maide Suresi", "Nur Suresi", "Mücadele Suresi", "Ahzab Suresi", "Haşr Suresi", "Tahrim Suresi", "Talak Suresi", "Hadid Suresi", "Fetih Suresi",
        "Mümtehine Suresi", "Hucurat Suresi", "Tevbe Suresi", "Nasr Suresi"
    ];

    let db = JSON.parse(localStorage.getItem('quran_app_db_v3') || '{}');
    let currentSurahIndex = null;

    function renderList() {
        const filter = document.getElementById('searchInput').value.toLowerCase();
        const listEl = document.getElementById('surahList');
        listEl.innerHTML = '';

        surahs.forEach((name, index) => {
            let num = index + 1;
            if (filter && !name.toLowerCase().includes(filter) && !num.toString().includes(filter)) return;

            // Yoxlayaq görək surə doludur ya boş
            let surahData = db[num] || {};
            let hasContent = Object.values(surahData.ayahs || {}).some(val => val && val.trim() !== "");
            
            let statusClass = hasContent ? "status-full" : "status-empty";
            let statusText = hasContent ? "Doludur" : "Boşdur";

            let item = document.createElement('div');
            item.className = 'surah-item';
            item.onclick = () => openSurah(index);
            item.innerHTML = `
                <span class="surah-name">${num}. ${name}</span>
                <span class="status-badge ${statusClass}">${statusText}</span>
            `;
            listEl.appendChild(item);
        });
    }

    function openSurah(index) {
        currentSurahIndex = index;
        let num = index + 1;
        document.getElementById('listView').style.display = 'none';
        document.getElementById('surahView').style.display = 'block';
        document.getElementById('currentSurahTitleinnerText') = `${num}. ${surahs[index]}`;
        document.getElementById('headerTitle').innerText = surahs[index];
        document.getElementById('bulkInput').value = '';

        renderAyahRows();
    }

    function goBack() {
        document.getElementById('surahView').style.display = 'none';
        document.getElementById('listView').style.display = 'block';
        document.getElementById('headerTitle').innerText = "Quran Tərcümə Paneli";
        renderList();
    }

    function renderAyahRows() {
        let num = currentSurahIndex + 1;
        if (!db[num]) db[num] = { ayahs: {} };
        
        let container = document.getElementById('ayahsListContainer');
        container.innerHTML = '';

        // Təqribi ayə sayı (istənilən qədər ayə xanası yaradılır, məsələn standart 30, lazım olsa artırmaq olar)
        let totalAyahs = 30; 
        for (let i = 1; i <= totalAyahs; i++) {
            let text = (db[num].ayahs && db[num].ayahs[i]) || "";
            let card = document.createElement('div');
            card.className = 'ayah-card';
            card.innerHTML = `
                <div class="ayah-header-num">${i}-ci Ayət</div>
                <textarea class="ayah-input" oninput="saveAyah(${i}, this.value)">${text}</textarea>
            `;
            container.appendChild(card);
        }
    }

    function saveAyah(ayahNum, val) {
        let num = currentSurahIndex + 1;
        if (!db[num]) db[num] = { ayahs: {} };
        db[num].ayahs[ayahNum] = val;
        localStorage.setItem('quran_app_db_v3', JSON.stringify(db));
    }

    // Demo yapışdırma və avtomatik bölmə (rəqəmlərə görə ayırma)
    function parseAndFill() {
        let rawText = document.getElementById('bulkInput').value;
        if (!rawText) return;

        let num = currentSurahIndex + 1;
        if (!db[num]) db[num] = { ayahs: {} };

        // Sadə ayırma: rəqəm və nöqtə ilə başlayan yerlərdən ayırır (məsələn: "1. ... 2. ...")
        let parts = rawText.split(/(?=\d+\s*[\.\-\)]\s*)/);
        
        parts.forEach(part => {
            let match = part.match(/^\s*(\d+)\s*[\.\-\)]\s*([\s\S]*)$/);
            if (match) {
                let ayahNum = parseInt(match[1]);
                let ayahText = match[2].trim();
                db[num].ayahs[ayahNum] = ayahText;
            }
        });

        localStorage.setItem('quran_app_db_v3', JSON.stringify(db));
        renderAyahRows();
        alert("Mətn uğurla ayələrə bölündü və damalara yerləşdirildi!");
    }

    function exportJSON() {
        let blob = new Blob([JSON.stringify(db, null, 2)], {type: "application/json"});
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "quran_butov_arxiv.json";
        a.click();
    }

    function copyAll() {
        let text = "";
        surahs.forEach((name, idx) => {
            let num = idx + 1;
            if (db[num] && db[num].ayahs) {
                text += `=== ${num}. ${name} ===\n`;
                for (let a in db[num].ayahs) {
                    if (db[num].ayahs[a]) text += `${a}. ${db[num].ayahs[a]}\n`;
                }
                text += "\n";
            }
        });
        navigator.clipboard.writeText(text);
        alert("Bütün tərcümələr kopyalandı!");
    }

    renderList();
</script>
</body>
</html>
